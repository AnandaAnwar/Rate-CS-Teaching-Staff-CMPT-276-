spring.application.name=rate-cs-staff

# Database. These defaults work on your laptop; on Render we override them with environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/rate_cs_staff}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${PORT:8080}