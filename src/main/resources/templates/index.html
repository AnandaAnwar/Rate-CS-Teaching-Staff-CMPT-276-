<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: pageHead(title='All ratings')}"></head>
<body>
<header th:replace="~{fragments :: siteHeader}"></header>
<main>
    <div th:replace="~{fragments :: flashMessages}"></div>

    <div class="page-head">
        <h1>All ratings</h1>
        <p class="count" th:unless="${#lists.isEmpty(ratings)}"
           th:text="${#lists.size(ratings) == 1} ? '1 rating' : |${#lists.size(ratings)} ratings|">3 ratings</p>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(ratings)}">
        <p>No ratings yet.</p>
        <a class="btn" th:href="@{/ratings/new}">Add the first rating</a>
    </div>

    <ul class="ratings" th:unless="${#lists.isEmpty(ratings)}">
        <li class="rating-row" th:each="r : ${ratings}">
            <div class="score"
                 th:classappend="${r.overallScore >= 8} ? 'good' : (${r.overallScore >= 5} ? 'mid' : 'low')">
                <span class="sr-only">Overall score</span>
                <span class="score-num" th:text="${#numbers.formatDecimal(r.overallScore, 1, 1)}">8.7</span>
                <span class="score-of">/ 10</span>
            </div>

            <div class="rating-main">
                <a class="rating-name" th:href="@{/ratings/{id}(id=${r.id})}" th:text="${r.profile.displayTitle()}">Name</a>
                <p class="rating-meta">
                    <span class="tag" th:classappend="'role-' + ${r.roleType.name()}" th:text="${r.roleType.label}">Role</span>
                    <span th:text="${r.email}">email</span>
                </p>
            </div>

            <div class="row-actions">
                <a th:href="@{/ratings/{id}/edit(id=${r.id})}">Edit</a>
                <a th:href="@{/ratings/{id}/delete(id=${r.id})}">Delete</a>
            </div>
        </li>
    </ul>
</main>
</body>
</html>
